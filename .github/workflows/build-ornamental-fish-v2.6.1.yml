name: Ornamental Fish v2.6.1 Play bundle

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  BUILD_TOOLS_VERSION: '36.0.0'
  EXPECTED_CERT_SHA256: '59F5D6ECBFED41958CA04DA3E23E5CE9ADA98814D5023B053336C39F0D21F51B'

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Restore payload
        run: |
          set -euo pipefail
          bash scripts/fetch-atlas.sh
          (cd app/src/main && sha256sum -c ../../../release-evidence/ACADEMIC_PAYLOAD_SHA256_v2.4.3.txt)
          echo 'ACADEMIC PAYLOAD INTEGRITY: PASS'
          python3 scripts/stamp-version.py
          echo 'USER-FACING VERSION STAMP: 2.6.1'
          python3 -m pip install --break-system-packages -q pillow || true
          python3 scripts/make-launcher-icons.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android 36 SDK
        run: sdkmanager 'platforms;android-36' "build-tools;$BUILD_TOOLS_VERSION"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Restore permanent release keystore
        env:
          OFISH_KEYSTORE_BASE64: ${{ secrets.OFISH_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$OFISH_KEYSTORE_BASE64" || { echo 'Missing OFISH_KEYSTORE_BASE64'; exit 1; }
          printf '%s' "$OFISH_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/ornamental-fish-release.jks"
          chmod 600 "$RUNNER_TEMP/ornamental-fish-release.jks"

      - name: Unit test and signed APK + AAB
        env:
          OFISH_KEYSTORE_FILE: ${{ runner.temp }}/ornamental-fish-release.jks
          OFISH_KEYSTORE_PASSWORD: ${{ secrets.OFISH_KEYSTORE_PASSWORD }}
          OFISH_KEY_ALIAS: ${{ secrets.OFISH_KEY_ALIAS }}
          OFISH_KEY_PASSWORD: ${{ secrets.OFISH_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$OFISH_KEYSTORE_PASSWORD"
          test "$OFISH_KEY_ALIAS" = 'ornamentalfish'
          test -n "$OFISH_KEY_PASSWORD"
          gradle --no-daemon test :app:assembleRelease :app:bundleRelease
          gradle --no-daemon lintRelease || true

      - name: Verify APK, AAB, alignment, signature
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          AAB=$(find app/build/outputs/bundle/release -name '*.aab' | head -1)
          test -n "$APK"
          test -n "$AAB"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION"
          "$BUILD_TOOLS/zipalign" -c -v 4 "$APK" | tee zipalign.txt
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee release-signing.txt
          CERT=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' release-signing.txt | tr -d ':' | tr '[:lower:]' '[:upper:]' | head -1)
          test "$CERT" = "$EXPECTED_CERT_SHA256"
          "$BUILD_TOOLS/aapt2" dump badging "$APK" | tee release-badging.txt
          grep -q "package: name='com.tnfisheries.ornamentalfish' versionCode='261' versionName='2.6.1'" release-badging.txt
          ! grep -q "uses-permission: name='android.permission.INTERNET'" release-badging.txt
          ! grep -q "android.permission.DUMP" release-badging.txt
          ! unzip -l "$APK" | grep -q 'DebugProbesKt.bin'
          cp "$APK" OrnamentalFish-v2.6.1.apk
          cp "$AAB" OrnamentalFish-v2.6.1.aab
          sha256sum OrnamentalFish-v2.6.1.apk OrnamentalFish-v2.6.1.aab | tee release-sha256.txt
          if [ -f app/build/reports/lint-results-release.html ]; then cp app/build/reports/lint-results-release.html lint-results-release.html; fi
          if [ -f app/build/reports/lint-results-release.xml ]; then cp app/build/reports/lint-results-release.xml lint-results-release.xml; fi

      - uses: actions/upload-artifact@v4
        with:
          name: OrnamentalFish-v2.6.1-play
          path: |
            OrnamentalFish-v2.6.1.apk
            OrnamentalFish-v2.6.1.aab
            release-signing.txt
            release-badging.txt
            release-sha256.txt
            zipalign.txt
            lint-results-release.html
            lint-results-release.xml
            docs/PLAY_RELEASE.md
