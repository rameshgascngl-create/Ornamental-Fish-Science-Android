name: Ornamental Fish native v3 Phase 2

on:
  workflow_dispatch:
  push:
    branches:
      - native/v3.0.0-phase2-ui-content-polish-20260928

permissions:
  contents: read

jobs:
  native-phase2-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android 36 SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Restore verified source and apply Phase-2 content polish
        run: bash scripts/fetch-native-content.sh

      - name: Prove legacy web runtime and banned learner wording are absent
        run: |
          set -euo pipefail
          test ! -e app/src/main/assets/index.html
          test ! -d app/src/main/assets/js
          test ! -d app/src/main/assets/css
          ! grep -R --line-number -E 'android\.webkit\.WebView|addJavascriptInterface|loadUrl\(' app/src/main/java 2>/dev/null
          ! grep -R --line-number -E 'TNAU|உள்பொரி|அகவாரி|ஒரண்டா|ஸெப்ரா டேனியோ|ஃபேன்சி|v1 printed|critical defect in v1|குஞ்சுகளை ஈனும்யும்' app/src/main/assets/data
          echo 'PHASE-2 CONTENT/ARCHITECTURE GATE: PASS'

      - name: Compile native Phase-2 debug APK
        run: gradle --no-daemon clean :app:assembleDebug

      - name: Verify native Phase-2 APK
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          test -n "$APK"
          unzip -l "$APK" | grep -q 'assets/data/species.json'
          unzip -l "$APK" | grep -q 'assets/fish_atlas/'
          ! unzip -l "$APK" | grep -Eq 'assets/(index\.html|js/|css/)'
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$APK" | tee native-phase2-badging.txt
          grep -q "versionCode='301'" native-phase2-badging.txt
          grep -q "versionName='3.0.0-alpha2-qa'" native-phase2-badging.txt
          sha256sum "$APK" | tee native-phase2-sha256.txt
          cp "$APK" OrnamentalFish-v3.0.0-alpha2-nativeQA.apk

      - uses: actions/upload-artifact@v4
        with:
          name: OrnamentalFish-v3.0.0-alpha2-nativeQA
          path: |
            OrnamentalFish-v3.0.0-alpha2-nativeQA.apk
            native-phase2-badging.txt
            native-phase2-sha256.txt
