name: Ornamental Fish native v3 Phase 1

on:
  workflow_dispatch:
  push:
    branches:
      - native/v3.0.0-phase1-foundation-20260928

permissions:
  contents: read

jobs:
  native-debug-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android 36 SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Restore verified native academic payload
        run: bash scripts/fetch-native-content.sh

      - name: Prove legacy web runtime is absent before build
        run: |
          set -euo pipefail
          test ! -e app/src/main/assets/index.html
          test ! -d app/src/main/assets/js
          test ! -d app/src/main/assets/css
          ! grep -R --line-number -E 'android\.webkit\.WebView|addJavascriptInterface|loadUrl\(' app/src/main/java 2>/dev/null
          echo 'WEBVIEW SOURCE GATE: PASS'

      - name: Compile native debug APK
        run: gradle --no-daemon clean :app:assembleDebug

      - name: Verify debug APK contains native payload and no web runtime assets
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          test -n "$APK"
          unzip -l "$APK" | grep -q 'assets/data/species.json'
          unzip -l "$APK" | grep -q 'assets/fish_atlas/'
          ! unzip -l "$APK" | grep -Eq 'assets/(index\.html|js/|css/)'
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$APK" | tee native-debug-badging.txt
          sha256sum "$APK" | tee native-debug-sha256.txt
          cp "$APK" OrnamentalFish-v3.0.0-alpha1-nativeQA.apk

      - uses: actions/upload-artifact@v4
        with:
          name: OrnamentalFish-v3.0.0-alpha1-nativeQA
          path: |
            OrnamentalFish-v3.0.0-alpha1-nativeQA.apk
            native-debug-badging.txt
            native-debug-sha256.txt
