name: Ornamental Fish v3.0.0 Native Production

on:
  workflow_dispatch:
  push:
    branches:
      - release/v3.0.0-native-production-20260929

permissions:
  contents: read

env:
  BUILD_TOOLS_VERSION: '36.0.0'
  EXPECTED_CERT_SHA256: '59F5D6ECBFED41958CA04DA3E23E5CE9ADA98814D5023B053336C39F0D21F51B'
  EXPECTED_PACKAGE: 'com.tnfisheries.ornamentalfish'
  EXPECTED_VERSION_NAME: '3.0.0'
  EXPECTED_VERSION_CODE: '300'

jobs:
  production:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android 36 SDK
        run: sdkmanager 'platforms;android-36' "build-tools;$BUILD_TOOLS_VERSION"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Restore verified native academic payload
        run: bash scripts/fetch-native-content.sh

      - name: Validate scientific and bilingual payload
        run: |
          set -euo pipefail
          python3 scripts/validate-native-content.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          rows=json.loads(Path('app/src/main/assets/data/book.json').read_text(encoding='utf-8'))
          assert len(rows)==37
          print('PRODUCTION TAMIL LESSON COUNT: PASS — 37 / 37')
          PY

      - name: Source architecture gate
        run: |
          set -euo pipefail
          test ! -e app/src/main/assets/index.html
          test ! -d app/src/main/assets/js
          test ! -d app/src/main/assets/css
          ! grep -R --line-number -E 'android\.webkit|android/webkit|WebView|JavascriptInterface|addJavascriptInterface|loadUrl\(|index\.html' app/src/main app/proguard-rules.pro 2>/dev/null
          ! grep -q 'ui-tooling-preview' app/build.gradle
          ! grep -q "debugImplementation 'androidx.compose.ui:ui-tooling'" app/build.gradle
          ! grep -q 'applicationIdSuffix' app/build.gradle || grep -q "applicationIdSuffix '.nativeqa'" app/build.gradle
          ! grep -q 'android.permission.INTERNET' app/src/main/AndroidManifest.xml
          ! grep -q 'android:debuggable=' app/src/main/AndroidManifest.xml
          ! grep -q 'android:configChanges=' app/src/main/AndroidManifest.xml
          echo 'NATIVE SOURCE ARCHITECTURE GATE: PASS'

      - name: Restore permanent production keystore
        env:
          OFISH_KEYSTORE_BASE64: ${{ secrets.OFISH_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$OFISH_KEYSTORE_BASE64" || { echo 'Missing OFISH_KEYSTORE_BASE64'; exit 1; }
          printf '%s' "$OFISH_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/ornamental-fish-release.jks"
          chmod 600 "$RUNNER_TEMP/ornamental-fish-release.jks"

      - name: Build signed native APK and AAB
        env:
          OFISH_KEYSTORE_FILE: ${{ runner.temp }}/ornamental-fish-release.jks
          OFISH_KEYSTORE_PASSWORD: ${{ secrets.OFISH_KEYSTORE_PASSWORD }}
          OFISH_KEY_ALIAS: ${{ secrets.OFISH_KEY_ALIAS }}
          OFISH_KEY_PASSWORD: ${{ secrets.OFISH_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$OFISH_KEYSTORE_PASSWORD"
          test "$OFISH_KEY_ALIAS" = 'ornamentalfish'
          test -n "$OFISH_KEY_PASSWORD"
          gradle --no-daemon clean :app:testReleaseUnitTest :app:lintRelease :app:assembleRelease :app:bundleRelease

      - name: Verify production package manifest permissions and signature
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          AAB=$(find app/build/outputs/bundle/release -name '*.aab' | head -1)
          test -n "$APK"
          test -n "$AAB"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION"

          "$BUILD_TOOLS/zipalign" -c -v 4 "$APK" | tee zipalign.txt
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee release-signing.txt
          CERT=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' release-signing.txt | tr -d ':' | tr '[:lower:]' '[:upper:]' | head -1)
          test "$CERT" = "$EXPECTED_CERT_SHA256"

          "$BUILD_TOOLS/aapt2" dump badging "$APK" | tee release-badging.txt
          grep -q "package: name='$EXPECTED_PACKAGE' versionCode='$EXPECTED_VERSION_CODE' versionName='$EXPECTED_VERSION_NAME'" release-badging.txt
          ! grep -q 'application-debuggable' release-badging.txt
          ! grep -q "uses-permission: name='android.permission.INTERNET'" release-badging.txt
          ! grep -q "uses-permission: name='android.permission.DUMP'" release-badging.txt
          ! grep -q "uses-permission: name='android.permission.CAMERA'" release-badging.txt
          ! grep -q "uses-permission: name='android.permission.READ_EXTERNAL_STORAGE'" release-badging.txt
          ! grep -q "uses-permission: name='android.permission.WRITE_EXTERNAL_STORAGE'" release-badging.txt

          "$BUILD_TOOLS/aapt2" dump xmltree "$APK" --file AndroidManifest.xml | tee release-manifest-tree.txt
          ! grep -q 'PreviewActivity' release-manifest-tree.txt
          ! grep -q 'debuggable' release-manifest-tree.txt
          grep -q 'com.tnfisheries.ornamentalfish.MainActivity' release-manifest-tree.txt

          jarsigner -verify -verbose -certs "$AAB" > aab-signature-verification.txt
          grep -q 'jar verified' aab-signature-verification.txt

      - name: Verify native binary and packaged content
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          AAB=$(find app/build/outputs/bundle/release -name '*.aab' | head -1)

          unzip -Z1 "$APK" | grep -q '^assets/data/species.json$'
          unzip -Z1 "$APK" | grep -q '^assets/data/book.json$'
          unzip -Z1 "$APK" | grep -q '^assets/data/quiz.json$'
          unzip -Z1 "$APK" | grep -q '^assets/data/labs.json$'
          test "$(unzip -Z1 "$APK" | grep -E '^assets/fish_atlas/.*\.(jpg|jpeg|png|webp)
          ! unzip -Z1 "$APK" | grep -Eq '^assets/(index\.html|js/|css/)'
          ! unzip -Z1 "$AAB" | grep -Eq '(^|/)assets/(index\.html|js/|css/)'

          TMP=$(mktemp -d)
          unzip -q "$APK" 'classes*.dex' -d "$TMP"
          ! grep -a -R -E -q 'android/webkit/WebView|android/webkit/JavascriptInterface|PreviewActivity|file:///android_asset/index\.html|\.nativeqa|3\.0\.0-alpha' "$TMP"

          test -s app/build/outputs/mapping/release/mapping.txt
          cp app/build/outputs/mapping/release/mapping.txt release-r8-mapping.txt
          echo 'NATIVE PRODUCTION BINARY GATE: PASS'

      - name: Freeze production artifacts and hashes
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          AAB=$(find app/build/outputs/bundle/release -name '*.aab' | head -1)
          cp "$APK" OrnamentalFish-v3.0.0-native-production.apk
          cp "$AAB" OrnamentalFish-v3.0.0-native-production.aab
          sha256sum OrnamentalFish-v3.0.0-native-production.apk OrnamentalFish-v3.0.0-native-production.aab | tee release-sha256.txt
          sha256sum app/src/main/assets/data/species.json app/src/main/assets/data/book.json app/src/main/assets/data/quiz.json app/src/main/assets/data/labs.json | tee release-data-sha256.txt
          echo "SOURCE_COMMIT=$GITHUB_SHA" | tee release-provenance.txt
          echo "PACKAGE=$EXPECTED_PACKAGE" >> release-provenance.txt
          echo "VERSION_NAME=$EXPECTED_VERSION_NAME" >> release-provenance.txt
          echo "VERSION_CODE=$EXPECTED_VERSION_CODE" >> release-provenance.txt
          echo "CERT_SHA256=$EXPECTED_CERT_SHA256" >> release-provenance.txt

      - name: Upload production release evidence
        uses: actions/upload-artifact@v4
        with:
          name: OrnamentalFish-v3.0.0-native-production
          path: |
            OrnamentalFish-v3.0.0-native-production.apk
            OrnamentalFish-v3.0.0-native-production.aab
            release-signing.txt
            aab-signature-verification.txt
            release-badging.txt
            release-manifest-tree.txt
            release-sha256.txt
            release-data-sha256.txt
            release-provenance.txt
            release-r8-mapping.txt
            zipalign.txt
            app/build/reports/lint-results-release.html
            app/build/reports/lint-results-release.xml
            app/build/reports/lint-results-release.txt
 | wc -l)" -eq 22
          ! unzip -Z1 "$APK" | grep -Eq '^assets/(index\.html|js/|css/)'
          ! unzip -Z1 "$AAB" | grep -Eq '(^|/)assets/(index\.html|js/|css/)'

          TMP=$(mktemp -d)
          unzip -q "$APK" 'classes*.dex' -d "$TMP"
          ! grep -a -R -E -q 'android/webkit/WebView|android/webkit/JavascriptInterface|PreviewActivity|file:///android_asset/index\.html|\.nativeqa|3\.0\.0-alpha' "$TMP"

          test -s app/build/outputs/mapping/release/mapping.txt
          cp app/build/outputs/mapping/release/mapping.txt release-r8-mapping.txt
          echo 'NATIVE PRODUCTION BINARY GATE: PASS'

      - name: Freeze production artifacts and hashes
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          AAB=$(find app/build/outputs/bundle/release -name '*.aab' | head -1)
          cp "$APK" OrnamentalFish-v3.0.0-native-production.apk
          cp "$AAB" OrnamentalFish-v3.0.0-native-production.aab
          sha256sum OrnamentalFish-v3.0.0-native-production.apk OrnamentalFish-v3.0.0-native-production.aab | tee release-sha256.txt
          sha256sum app/src/main/assets/data/species.json app/src/main/assets/data/book.json app/src/main/assets/data/quiz.json app/src/main/assets/data/labs.json | tee release-data-sha256.txt
          echo "SOURCE_COMMIT=$GITHUB_SHA" | tee release-provenance.txt
          echo "PACKAGE=$EXPECTED_PACKAGE" >> release-provenance.txt
          echo "VERSION_NAME=$EXPECTED_VERSION_NAME" >> release-provenance.txt
          echo "VERSION_CODE=$EXPECTED_VERSION_CODE" >> release-provenance.txt
          echo "CERT_SHA256=$EXPECTED_CERT_SHA256" >> release-provenance.txt

      - name: Upload production release evidence
        uses: actions/upload-artifact@v4
        with:
          name: OrnamentalFish-v3.0.0-native-production
          path: |
            OrnamentalFish-v3.0.0-native-production.apk
            OrnamentalFish-v3.0.0-native-production.aab
            release-signing.txt
            aab-signature-verification.txt
            release-badging.txt
            release-manifest-tree.txt
            release-sha256.txt
            release-data-sha256.txt
            release-provenance.txt
            release-r8-mapping.txt
            zipalign.txt
            app/build/reports/lint-results-release.html
            app/build/reports/lint-results-release.xml
            app/build/reports/lint-results-release.txt
