plugins {
    id 'com.android.application'
}

android {
    namespace 'com.tnfisheries.ornamentalfish'
    compileSdk 36

    defaultConfig {
        applicationId 'com.tnfisheries.ornamentalfish'
        minSdk 24
        targetSdk 36
        versionCode 261
        versionName '2.6.1'
    }

    signingConfigs {
        release {
            def ks = System.getenv('OFISH_KEYSTORE_FILE')
            def ksp = System.getenv('OFISH_KEYSTORE_PASSWORD')
            def alias = System.getenv('OFISH_KEY_ALIAS')
            def kp = System.getenv('OFISH_KEY_PASSWORD')
            if (ks && ksp && alias && kp) {
                storeFile file(ks)
                storePassword ksp
                keyAlias alias
                keyPassword kp
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (System.getenv('OFISH_KEYSTORE_FILE')) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += [
                'DebugProbesKt.bin',
                'META-INF/*.kotlin_module',
                'kotlin-tooling-metadata.json'
            ]
        }
    }
}

// Framework-only. AppCompat / Material pull ProfileInstaller
// (DUMP-guarded receiver) and can leak DebugProbesKt.bin.
dependencies {
}
