plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.tnfisheries.ornamentalfish'
    compileSdk 36

    defaultConfig {
        applicationId 'com.tnfisheries.ornamentalfish'
        minSdk 24
        targetSdk 36
        versionCode 300
        versionName '3.0.0-alpha1'
    }

    signingConfigs {
        release {
            def ks = System.getenv('OFISH_KEYSTORE_FILE')
            def ksp = System.getenv('OFISH_KEYSTORE_PASSWORD')
            def alias = System.getenv('OFISH_KEY_ALIAS')
            def kp = System.getenv('OFISH_KEY_PASSWORD')
            if (ks && ksp && alias && kp) {
                storeFile file(ks)
                storePassword ksp
                keyAlias alias
                keyPassword kp
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.nativeqa'
            versionNameSuffix '-qa'
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (System.getenv('OFISH_KEYSTORE_FILE')) {
                signingConfig signingConfigs.release
            }
        }
    }

    buildFeatures {
        compose true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    packaging {
        resources {
            excludes += [
                'DebugProbesKt.bin',
                'META-INF/*.kotlin_module',
                'kotlin-tooling-metadata.json'
            ]
        }
    }
}

dependencies {
    def composeBom = platform('androidx.compose:compose-bom:2025.08.00')
    implementation composeBom
    androidTestImplementation composeBom

    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    debugImplementation 'androidx.compose.ui:ui-tooling'
}
