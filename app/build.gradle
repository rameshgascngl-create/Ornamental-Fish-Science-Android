plugins {
    id 'com.android.application'
}

android {
    namespace 'com.tnfisheries.ornamentalfish'
    compileSdk 36

    defaultConfig {
        applicationId 'com.tnfisheries.ornamentalfish'
        minSdk 24
        targetSdk 36
        versionCode 250
        versionName '2.5.0'
    }

    signingConfigs {
        release {
            def ks = System.getenv('OFISH_KEYSTORE_FILE')
            def ksp = System.getenv('OFISH_KEYSTORE_PASSWORD')
            def alias = System.getenv('OFISH_KEY_ALIAS')
            def kp = System.getenv('OFISH_KEY_PASSWORD')
            if (ks && ksp && alias && kp) {
                storeFile file(ks)
                storePassword ksp
                keyAlias alias
                keyPassword kp
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            if (System.getenv('OFISH_KEYSTORE_FILE')) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'com.google.android.material:material:1.12.0'
}
